{% extends "base.html" %}

{% block title %}
Leitor de Extrato
{% endblock %}

{% block content %}

<div class="container">

    <h1>
        Leitor de Extrato
    </h1>

    <p class="subtitulo">
        Leitura automática de extrato bancário
    </p>


    <div class="banco">

        <span>
            {{ empresa.replace('_', ' ').upper() }}
        </span>

    </div>


    <form
        action="{{ url_for('processar') }}"
        method="POST"
        enctype="multipart/form-data"
        id="formExtrato"
    >

        <input
            type="hidden"
            name="empresa"
            value="{{ empresa }}"
        >


        <div
            class="upload-box"
            id="uploadBox"
        >

            <div class="icone">
                ↑
            </div>

            <h2>
                Arraste seu extrato aqui
            </h2>

            <p>
                ou selecione o arquivo
            </p>


            <input
                type="file"
                id="arquivo"
                name="arquivo"
                accept=".pdf,.xls,.xlsx"
                hidden
                required
            >


            <button
                type="button"
                id="selecionar"
            >
                Selecionar Arquivo
            </button>


            <p id="nomeArquivo"></p>

        </div>


        <button
            type="submit"
            class="processar"
            id="processar"
            name="modo"
            value="normal"
            disabled
        >
            Processar Extrato
        </button>

    </form>


    <div
        class="resultado"
        id="resultado"
    ></div>

</div>


<script
    src="{{ url_for('static', filename='script.js') }}"
></script>

{% endblock %}
